name: Game checks

on:
  push:
    branches: [main]
    paths: ['game/**', '.github/workflows/game-ci.yml']
  pull_request:
    paths: ['game/**', '.github/workflows/game-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: game/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
        env:
          VITE_BASE_PATH: /uisaeng-game/
      - uses: actions/upload-artifact@v4
        with:
          name: uisaeng-game-static
          path: game/dist
          if-no-files-found: error
